<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Inspection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
        }

        .camera-box {
            background: black;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            display: block;
            max-height: 60vh;
            object-fit: contain;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Vision Inspection</h1>
    <p>Mechanical Component Measurement & Inspection</p>
</header>

<div class="container">

    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
    </div>

    <div class="buttons">
        <button onclick="startCamera()">📷 Live Camera</button>
        <button onclick="capturePhoto()">📸 Calibrate Only</button>
        <button onclick="measureObject()">📏 Measure Object</button>
        <button onclick="startRecording()">🎥 Record Video</button>
    </div>

    <div id="status">
        Camera not started.
    </div>

</div>

<script>
    const video = document.getElementById("camera");
    const statusBox = document.getElementById("status");

    let stream = null;
    let recorder = null;
    let recordedChunks = [];

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                },
                audio: false
            });

            video.srcObject = stream;

            statusBox.innerText =
                "Live camera active. Place the calibration marker and component in view.";

        } catch (error) {
            statusBox.innerText =
                "Camera access failed: " + error.message;
        }
    }

    // Captures the current video frame as a JPEG blob
    function captureFrame() {
        return new Promise((resolve, reject) => {

            if (!stream) {
                reject(new Error("Start the camera first."));
                return;
            }

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                if (blob) {
                    resolve(blob);
                } else {
                    reject(new Error("Failed to capture frame."));
                }
            }, "image/jpeg");
        });
    }

    async function sendToEndpoint(endpoint) {
        try {
            statusBox.innerText = "Processing image...";

            const blob = await captureFrame();

            const formData = new FormData();
            formData.append("file", blob, "inspection_capture.jpg");

            const response = await fetch(window.location.origin + endpoint, {
                method: "POST",
                body: formData
            });

            const result = await response.json();
            return result;

        } catch (error) {
            statusBox.innerText = "Error: " + error.message;
            return null;
        }
    }

    async function capturePhoto() {
        const result = await sendToEndpoint("/calibrate");
        if (!result) return;

        if (result.success) {
            statusBox.innerText =
                "✅ Calibration successful! " +
                "Marker: " + result.marker_id +
                " | Scale: " +
                result.mm_per_pixel.toFixed(4) +
                " mm/pixel";
        } else {
            statusBox.innerText = "Result: " + JSON.stringify(result);
        }
    }

    async function measureObject() {
        const result = await sendToEndpoint("/measure");
        if (!result) return;

        if (result.success) {
            const m = result.measurement;
            const id = m.identification;
            statusBox.innerText =
                "✅ Measurement successful!\n" +
                "Component: " + id.component_type + "\n" +
                "Width: " + m.width_mm + " mm\n" +
                "Height: " + m.height_mm + " mm\n" +
                "Has hole: " + (m.has_internal_hole ? "Yes" : "No") + "\n" +
                "Scale used: " + result.calibration.mm_per_pixel.toFixed(4) + " mm/pixel\n" +
                "Reason: " + id.reason;
        } else {
            statusBox.innerText = "Result: " + JSON.stringify(result);
        }
    }

    function startRecording() {

        if (!stream) {
            statusBox.innerText = "Start the camera first.";
            return;
        }

        recordedChunks = [];

        recorder = new MediaRecorder(stream);

        recorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        recorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: "video/webm" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "inspection_video.webm";
            link.click();

            statusBox.innerText = "Video recorded successfully.";
        };

        recorder.start();

        statusBox.innerText =
            "Recording video... Click Record Video again to stop.";

        setTimeout(() => {
            if (recorder && recorder.state === "recording") {
                recorder.stop();
            }
        }, 10000);
    }
</script>

</body>
</html>
